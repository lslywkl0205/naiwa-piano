<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>奶蛙钢琴块</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#fff;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    -webkit-user-select:none;user-select:none}
  #app{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;background:#fff}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
  .screen.active{display:flex}

  /* ---------- 首页 ---------- */
  #home{background:linear-gradient(180deg,#fff8e6 0%,#ffffff 62%);padding:34px 26px 30px}
  .badge{font-size:12px;letter-spacing:.22em;color:#c99a1a;font-weight:700}
  #home h1{font-size:38px;letter-spacing:.06em;color:#2b2418;margin-top:10px}
  #home .sub{font-size:20px;font-weight:800;letter-spacing:.12em;color:#e07800;margin-top:12px;
    text-shadow:0 2px 0 rgba(255,210,120,.6)}
  .mascot{margin:26px 0 8px;width:186px;height:186px;border-radius:34px;overflow:hidden;
    background:#fff;box-shadow:0 14px 34px rgba(160,120,30,.22),0 2px 0 #f4e2b8}
  .mascot img{width:100%;height:100%;object-fit:cover;display:block}
  .best-pill{margin-top:20px;font-size:13px;color:#7d6a4a;background:#fff4d9;
    border:1px solid #ffe1a1;border-radius:999px;padding:8px 18px}
  .best-pill b{color:#e0900a;font-size:15px;margin-left:4px}
  .btn{width:100%;max-width:300px;border:0;border-radius:18px;padding:16px 0;font-size:17px;
    font-weight:700;letter-spacing:.04em;cursor:pointer;transition:transform .12s,box-shadow .12s;
    font-family:inherit}
  .btn:active{transform:scale(.97)}
  .btn.primary{margin-top:26px;color:#3a2a00;background:linear-gradient(180deg,#ffd95c,#ffb630);
    box-shadow:0 8px 0 #e59a12,0 14px 26px rgba(255,180,40,.35)}
  .btn.primary:active{box-shadow:0 4px 0 #e59a12}
  .btn.ghost{margin-top:12px;color:#8a7a5c;background:#fff;border:1.5px solid #efe3cd;
    box-shadow:0 4px 0 #f3ead9}
  .tip{font-size:12px;color:#b9a888;margin-top:16px;text-align:center;line-height:1.7}

  /* ---------- 游戏 ---------- */
  #game{background:#fff}
  .hud{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px 10px;border-bottom:1px solid #f3ecdd}
  .hud .score{font-size:44px;font-weight:800;color:#2b2418;line-height:1}
  .hud .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .hud .best{font-size:12px;color:#a08d70}
  .hud .best b{color:#e0900a;font-size:14px;margin-left:3px}
  .lives{display:flex;gap:5px}
  .lives img{width:26px;height:26px;object-fit:cover;border-radius:7px;display:block;
    box-shadow:0 2px 5px rgba(90,140,190,.35);transition:transform .18s,opacity .18s,filter .18s}
  .lives img.lost{filter:grayscale(1);opacity:.22;transform:scale(.8)}
  .combo{position:absolute;left:50%;transform:translateX(-50%);top:80px;font-size:15px;
    font-weight:800;color:#ff8a00;opacity:0;transition:opacity .15s;pointer-events:none;z-index:4}
  .combo.show{opacity:1}
  #board{position:relative;flex:1;width:100%;overflow:hidden;background:#fff;touch-action:none;
    background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),
      #f3ecdd calc(25% - 1px),#f3ecdd 25%)}
  .block{position:absolute;border-radius:16px;background-size:cover;background-position:center;
    background-color:#ffd24d;box-shadow:0 5px 0 rgba(160,110,10,.18),0 10px 20px rgba(160,110,10,.14);
    will-change:transform;cursor:pointer;transform:translate3d(0,0,0);backface-visibility:hidden}
  .block.short{background-repeat:no-repeat}
  .block.long{background-image:url("./assets/long.jpg");
    background-size:100% 100%;background-repeat:no-repeat;overflow:hidden;border-radius:14px;
    box-shadow:0 5px 0 rgba(160,110,10,.18),0 10px 20px rgba(160,110,10,.14)}
  .block.long .seg{position:absolute;left:0;width:100%;background:none;
    border-bottom:2px solid rgba(255,255,255,.8)}
  .block.long .seg:last-child{border-bottom:none}
  .block.long .seg.hit::after{content:"";position:absolute;inset:0;background:rgba(24,12,0,.55)}
  .block.long.hold{box-shadow:0 0 0 3px rgba(255,90,0,.55),0 10px 22px rgba(200,90,10,.3)}
  .block.pop{opacity:0;transition:opacity .18s ease;pointer-events:none}
  .block.missed{box-shadow:0 0 0 3px #ff3b30,0 0 22px rgba(255,60,48,.6);opacity:.5}
  body.freeze .block{opacity:.18;filter:grayscale(.7)}
  body.freeze .block.fail-highlight{opacity:1;filter:none;box-shadow:0 0 0 4px #ff3b30,
    0 0 30px 6px rgba(255,60,48,.65);animation:failPulse .55s ease-in-out infinite alternate;z-index:5}
  @keyframes failPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
  .fail-banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
    background:rgba(28,20,14,.86);color:#fff;border-radius:18px;padding:16px 26px;
    font-size:19px;font-weight:800;letter-spacing:.04em;z-index:8;display:none;
    box-shadow:0 16px 40px rgba(0,0,0,.35)}
  .fail-banner.show{display:block;animation:fadeUp .25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translate(-50%,-42%)}to{opacity:1;transform:translate(-50%,-50%)}}
  .countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:130px;font-weight:800;color:#ff9c00;background:rgba(255,255,255,.72);
    z-index:5;animation:cd .6s ease}
  .countdown.hidden{display:none}
  .countdown.go{color:#22b573}
  @keyframes cd{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}

  /* ---------- 结束 ---------- */
  #over{background:linear-gradient(180deg,#fff6e5,#ffffff);padding:40px 26px 30px;overflow:hidden}
  #over h2{font-size:30px;color:#2b2418}
  #over .why{font-size:13px;color:#a08d70;margin-top:8px}
  .newbest{height:26px;margin-top:18px;font-size:20px;font-weight:900;letter-spacing:.14em;
    color:#ff5a00;opacity:0;transform:translateY(6px);transition:.3s}
  .newbest.show{opacity:1;transform:none;text-shadow:0 0 18px rgba(255,140,0,.55)}
  .score-card{width:100%;max-width:300px;margin-top:8px;background:#fff;
    border:1px solid #f3e6cc;border-radius:22px;padding:22px 0;text-align:center;
    box-shadow:0 12px 30px rgba(170,130,40,.10);position:relative;z-index:2}
  .score-card .label{font-size:12px;color:#a08d70;letter-spacing:.08em}
  .score-card .big{font-size:58px;font-weight:800;color:#ff9c00;line-height:1.1;margin:6px 0 10px}
  .score-card b{color:#e0900a}
  .stars{margin:6px 0 12px;font-size:26px;letter-spacing:6px;color:#ecdcc0}
  .stars i{font-style:normal;transition:.25s}
  .stars i.on{color:#ffb300;text-shadow:0 0 12px rgba(255,180,0,.55)}
  #fx{position:absolute;inset:0;pointer-events:none;z-index:1}
  .hud-stars{display:flex;gap:2px;font-size:15px;letter-spacing:1px;color:#e3d3b5;margin-top:4px}
  .hud-stars i{font-style:normal;transition:transform .25s}
  .hud-stars i.on{color:#ffb300;text-shadow:0 0 8px rgba(255,180,0,.55)}
  .hud-stars.pulse i.on{animation:starpop .5s ease}
  @keyframes starpop{0%{transform:scale(1)}35%{transform:scale(1.55)}70%{transform:scale(.92)}100%{transform:scale(1)}}
  #starToast{position:fixed;top:12px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;z-index:80;pointer-events:none;background:linear-gradient(135deg,#ffe28a,#ffab1f);color:#3a2200;font-weight:800;font-size:22px;padding:10px 24px;border-radius:999px;box-shadow:0 10px 28px rgba(255,160,0,.5);white-space:nowrap;letter-spacing:1px}
  #starToast.show{animation:starToastIn 1.4s ease forwards}
  @keyframes starToastIn{0%{opacity:0;transform:translateX(-50%) scale(.5)}16%{opacity:1;transform:translateX(-50%) scale(1.16)}26%{transform:translateX(-50%) scale(1)}78%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1.04)}}
  .block.ice,.block.ice .seg{background-image:var(--ice)!important;background-size:100% 100%!important}
  .pause-mask{position:fixed;inset:0;background:rgba(24,18,10,.5);display:none;align-items:center;justify-content:center;z-index:60}
  .pause-mask.show{display:flex}
  .pause-mask img{max-width:76%;max-height:66%;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  /* ====== 声音设置面板 ====== */
  .snd-panel { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 22px; background: rgba(30,22,12,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .snd-panel.show { display: flex; }
  .snd-card { width: 100%; max-width: 342px; background: #fffaf0; border-radius: 22px; padding: 22px 20px 16px; box-shadow: 0 26px 70px rgba(0,0,0,.35); }
  .snd-card h3 { font-size: 19px; color: #2b2418; text-align: center; margin-bottom: 16px; }
  .snd-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #6b5a3e; }
  .snd-row > span { flex: 0 0 112px; }
  .snd-row input[type=range] { flex: 1; accent-color: #ffb630; height: 22px; }
  .snd-row b { flex: 0 0 42px; text-align: right; color: #e07800; font-size: 13px; font-variant-numeric: tabular-nums; }
  .snd-row.switch > span { flex: 1; }
  .snd-row.switch input { width: 22px; height: 22px; accent-color: #ffb630; }
  .snd-actions { display: flex; gap: 10px; margin-top: 6px; }
  .snd-actions .btn { flex: 1; margin: 0; padding: 12px 0; font-size: 15px; }
  #btnSnd { margin-top: 10px; padding: 10px 22px; font-size: 14px; }
  /* ====== 道具选择 ====== */
  .items { display: flex; gap: 10px; justify-content: center; margin: 16px 0 4px; width: 100%; padding: 0 6px; box-sizing: border-box; }
  .item { flex: 1; max-width: 110px; background: #fff; border: 2px solid #ffe2b0; border-radius: 16px; padding: 8px 6px 7px; cursor: pointer; transition: transform .16s, box-shadow .16s, border-color .16s; box-shadow: 0 4px 0 #f3d7a8; font-family: inherit; }
  .item img { width: 100%; height: 60px; object-fit: cover; border-radius: 10px; display: block; }
  .item span { display: block; font-size: 12px; font-weight: 800; color: #6b4a14; margin-top: 6px; white-space: nowrap; }
  .item em { display: none; font-style: normal; font-size: 11px; color: #9a7a48; margin-top: 3px; line-height: 1.25; }
  .item.on { transform: translateY(-8px); border-color: #ffb630; box-shadow: 0 12px 18px rgba(224,120,0,.28), 0 4px 0 #e8b25a; }
  .item.on em { display: block; }
  .wheel-btn { position: relative; margin-top: 6px; }
  .wheel-dot { position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #ff3b30; color: #fff; font-size: 12px; font-weight: 800; line-height: 20px; text-align: center; box-shadow: 0 2px 6px rgba(255,59,48,.5); }
  .wheel-dot.hidden { display: none; }
  /* ====== 游戏内按钮 ====== */
  .hud-btn { position: absolute; z-index: 6; border: none; background: rgba(255,255,255,.92); box-shadow: 0 4px 12px rgba(0,0,0,.14); border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
  #btnPause { right: 14px; bottom: 96px; width: 52px; height: 52px; font-size: 17px; color: #7a5a2a; }
  #btnQuitGame { left: 14px; bottom: 96px; width: 52px; height: 52px; font-size: 18px; color: #b23a3a; }
  #game .items { display: none; position: absolute; left: 10px; right: 10px; bottom: 8px; margin: 0; z-index: 7; }
  #itemBar .item { position: relative; }
  .item-badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; background: #e2402e; color: #fff; font-size: 11px; font-weight: 800; text-align: center; padding: 0 5px; box-shadow: 0 1px 4px rgba(0,0,0,.28); }
  .item-badge.hidden { display: none; }
  #itemBar .item.empty { opacity: .42; }
  .quit-mask { position: fixed; inset: 0; background: rgba(24,14,4,.55); display: flex; align-items: center; justify-content: center; z-index: 80; }
  .quit-mask.hidden { display: none; }
  .quit-card { background: #fffaf0; border: 3px solid #f0b429; border-radius: 18px; padding: 22px 24px; width: 264px; text-align: center; box-shadow: 0 18px 44px rgba(0,0,0,.35); }
  .quit-card h3 { font-size: 19px; margin: 0 0 14px; color: #7a4a00; }
  .quit-card .btn { display: block; width: 100%; margin: 8px 0 0; }
  #btnSlow { right: 14px; bottom: 164px; width: 44px; height: 44px; padding: 3px; }
  #btnSlow img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
  #btnSlow.hidden, #pauseMask2.hidden, .sprint-layer.hidden { display: none; }
  .sprint-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: flex; align-items: center; justify-content: center; transition: opacity .5s; }
  .sprint-layer img { width: 62%; max-width: 300px; filter: drop-shadow(0 12px 30px rgba(120,40,160,.45)); animation: sprintFloat 1.6s ease-in-out infinite; }
  @keyframes sprintFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.03); } }
  .start-block { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); width: 62%; padding: 22px 0; border-radius: 20px; background: linear-gradient(180deg, #ffd778, #ffb630); color: #6b3d00; font-size: 34px; font-weight: 900; letter-spacing: .3em; text-align: center; box-shadow: 0 14px 30px rgba(224,120,0,.35), 0 6px 0 #e0982a; z-index: 7; cursor: pointer; animation: startPulse 1.2s ease-in-out infinite; }
  @keyframes startPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } }
  .pause-mask2 { position: absolute; inset: 0; z-index: 9; background: rgba(30,20,10,.62); display: flex; align-items: center; justify-content: center; }
  .pm-card { background: #fffaf0; border-radius: 22px; padding: 24px 26px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
  .pm-card h3 { font-size: 20px; color: #2b2418; margin-bottom: 16px; }
  .pm-card .btn { display: block; width: 170px; margin: 8px auto 0; }
  /* ====== 转盘 ====== */
  .wheel-slot { width: 132px; height: 132px; margin: 4px auto 10px; border-radius: 20px; background: #fff3dc; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px dashed #ffcf8a; }
  .wheel-slot img { width: 100%; height: 100%; object-fit: cover; }
  .wheel-slot img.big { object-fit: contain; padding: 6px; }
  #wheelMsg { font-size: 13px; color: #6b5a3e; text-align: center; line-height: 1.5; min-height: 40px; }
</style>
</head>
<body>
<div id="app">
  <!-- 首页 -->
  <section id="home" class="screen active">
    <div class="badge">NAIWA PIANO</div>
    <h1>奶蛙钢琴块</h1>
    <p class="sub">下拉一下</p>
    <div class="mascot"><img id="mascotImg" alt="奶龙"></div>
    <div class="best-pill">最高分<b id="homeBest">0</b></div>
    <button id="btnWheel" class="btn ghost wheel-btn">🎡 每日转盘<span id="wheelDot" class="wheel-dot">3</span></button>
    <button id="btnStart" class="btn primary">开始游戏</button>
    <button id="btnSnd" class="btn ghost">⚙ 声音设置</button>
    <p class="tip">3 格血，共 2 次容错；漏块、点空、牛来没按住，都会掉血</p>
  </section>

  <!-- 游戏 -->
  <section id="game" class="screen">
    <header class="hud">
      <div class="score" id="score">0</div>
      <div class="right">
        <div class="best">最高<b id="gameBest">0</b></div>
        <div class="hud-stars" id="hudStars"></div>
        <div class="lives" id="lives"></div>
      </div>
    </header>
    <div id="combo" class="combo"></div>
    <div id="board"></div>
    <div class="items" id="itemBar">
      <button class="item" data-item="slow"><span class="item-badge hidden">0</span><img src="./assets/blood.jpg" alt="冰冰冰"><span>冰冰冰道具</span></button>
      <button class="item" data-item="double"><span class="item-badge hidden">0</span><img src="./assets/yujie.jpg" alt="东北雨姐"><span>东北雨姐道具</span></button>
      <button class="item" data-item="sprint"><span class="item-badge hidden">0</span><img src="./assets/thanos.jpg" alt="灭霸"><span>灭霸道具</span></button>
    </div>
    <button id="btnQuitGame" class="hud-btn" aria-label="退出">✕</button>
    <button id="btnPause" class="hud-btn" aria-label="暂停">❚❚</button>
    <button id="btnSlow" class="hud-btn hidden" aria-label="降速道具"><img src="./assets/blood.jpg" alt="冰冰冰"></button>
    <div id="sprintLayer" class="sprint-layer hidden"><img src="./assets/thanos_sprint.jpg" alt="灭霸冲刺"></div>
    <div id="pauseMask2" class="pause-mask2 hidden"><div class="pm-card"><h3>暂停中</h3><button id="btnResume" class="btn primary">继续</button><button id="btnQuit" class="btn ghost">退出本局</button></div></div>
    <div id="failBanner" class="fail-banner"></div>
    <div id="countdown" class="countdown hidden"></div>
    <div id="quitMask" class="quit-mask hidden"><div class="quit-card"><h3>是否退出本局？</h3><button id="btnQuitYes" class="btn primary">是，退出</button><button id="btnQuitNo" class="btn ghost">否，继续玩</button></div></div>
  </section>

  <!-- 结束 -->
  <section id="over" class="screen">
    <canvas id="fx"></canvas>
    <h2>游戏结束</h2>
    <p class="why" id="overWhy">三次失误，血用完了</p>
    <div class="newbest" id="newBest">New Best !</div>
    <div class="score-card">
      <div class="label">本局得分</div>
      <div class="big" id="finalScore">0</div>
      <div class="stars" id="stars"></div>
      <div class="label">最高分 <b id="finalBest">0</b></div>
    </div>
    <button id="btnAgain" class="btn primary">再玩一次</button>
    <button id="btnHome" class="btn ghost">返回首页</button>
  </section>
</div>
<audio id="laugh" preload="auto"></audio>
<audio id="sfxLong" preload="auto"></audio>
<audio id="sfxFail" preload="auto"></audio>
<audio id="bgmStart" preload="auto" loop></audio>
<audio id="bgmPlay" preload="auto" loop></audio>
<audio id="sfxPause" preload="auto"></audio>
<audio id="sfxOver" preload="auto"></audio>
<div id="starToast"></div>
<div id="pauseMask" class="pause-mask"><img id="pauseImg" alt=""></div>

<div id="sndPanel" class="snd-panel">
  <div class="snd-card">
    <h3>声音设置</h3>
    <label class="snd-row"><span>灭建国（BGM）</span><input id="sndBgm" type="range" min="0" max="1" step="0.05"><b id="sndBgmV">0.50</b></label>
    <label class="snd-row"><span>牛来（长块）</span><input id="sndLong" type="range" min="0" max="1" step="0.05"><b id="sndLongV">0.50</b></label>
    <label class="snd-row"><span>奶娃笑（短块）</span><input id="sndShort" type="range" min="0" max="1" step="0.05"><b id="sndShortV">0.50</b></label>
    <label class="snd-row switch"><span>背景音乐开关</span><input id="sndMusic" type="checkbox"></label>
    <div class="snd-actions"><button id="sndReset" class="btn ghost">恢复默认</button><button id="sndClose" class="btn primary">完成</button></div>
  </div>
</div>
<div id="wheelPanel" class="snd-panel">
  <div class="snd-card">
    <h3>每日转盘</h3>
    <div class="wheel-slot" id="wheelSlot"><img id="wheelImg" alt="奖品"></div>
    <p id="wheelMsg">每天 3 次，三种道具各 25%，谢谢参与 25%</p>
    <div class="snd-actions"><button id="wheelGo" class="btn primary">抽一次</button><button id="wheelClose" class="btn ghost">关闭</button></div>
  </div>
</div>
<script>
(function () {
  'use strict';

  /* ====== 可调参数 ====== */
  var CFG = {
    COLS: 4,               // 列数
    FALL_SEC: 1.6,         // 初始：方块从顶到底的秒数
    SPEED_CURVE: [[0, 1], [50, 1.30], [120, 1.50], [220, 1.62], [300, 1.694], [432, 2], [2160, 3.5], [4320, 4], [8640, 4.4], [12960, 4.5]], // 分数→倍率锚点（300 前加速，300 后与原曲线一致）
    SPEED_FAST_GAIN: 2.2,  // 前段加速量（快曲线）
    SPEED_FAST_TAU: 120,   // 前段加速时间常数（分）
    SPEED_SLOW_GAIN: 2.8,  // 后段加速量（慢曲线，负责把速率延展到 5000 分）
    SPEED_SLOW_TAU: 1400,  // 后段加速时间常数（分）
    SPAWN_MS: 620,         // 初始生成间隔（毫秒）

    if (newest && newest.y < blockH * 0.1) return;

    for (var c = 0; c < CFG.COLS; c++) {

  /* ====== 倒计时 ====== */
  function countdown(done) {
    var seq = ['3', '2', '1', 'GO'];
    var i = 0;
    cdEl.classList.remove('hidden', 'go');
    (function tick() {
      if (i >= seq.length) { cdEl.classList.add('hidden'); done(); return; }
      cdEl.textContent = seq[i];
      cdEl.classList.toggle('go', seq[i] === 'GO');
      cdEl.style.animation = 'none';
      void cdEl.offsetWidth;
      cdEl.style.animation = '';
      i += 1;
      setTimeout(tick, 620);
    })();
  }

  /* ====== 主循环 ====== */
  function loop(now) {
    if (!state.running) return;
    if (state.paused) { state.last = now; requestAnimationFrame(loop); return; }
    var dt = Math.min(50, now - state.last) / 1000;
    state.last = now;

    // 降速道具到时：播冰冰冰提示音，之后倍率平滑回到实时速度
    if (state.slowActive && now > state.slowUntil) {
      state.slowActive = false;
      playBuf('fail', 0.95);
    }
    // 道具倍率（降速 0.55、冲刺 2），每帧向目标平滑靠拢
    var targetMul = 1;
    if (state.slowActive) targetMul *= 0.55;
    if (now < state.sprintUntil) targetMul *= 2;
    state.speedMul += (targetMul - state.speedMul) * Math.min(1, dt * 3.2);

    // 速度倍率：按分数在锚点间线性插值
    var mult = 4.5;
    var curve = CFG.SPEED_CURVE;
    for (var ci = 1; ci < curve.length; ci++) {
      if (state.score <= curve[ci][0]) {
        var c0 = curve[ci - 1][0], c1 = curve[ci][0];
        var m0 = curve[ci - 1][1], m1 = curve[ci][1];
        mult = m0 + (m1 - m0) * (state.score - c0) / (c1 - c0);
        break;
      }
    }
    var eff = mult * state.speedMul;
    var speed = (boardH / CFG.FALL_SEC) * eff;
    var judgeY = boardH - blockH * CFG.JUDGE_PAD;

    // 生成节拍 = 下落一个身位的时间，跟着加速一起变快，保证块与块首尾相接
    var spawnMs = (CFG.FALL_SEC * 1000 / 4) / eff * 0.98;
    state.spawnAcc += dt * 1000;
    if (state.spawnAcc >= spawnMs) {
      state.spawnAcc = 0;
      spawn();
    }

    for (var i = state.blocks.length - 1; i >= 0; i--) {
      var b = state.blocks[i];
      b.y += speed * dt;
      b.el.style.transform = 'translate3d(0,' + b.y + 'px,0)';
      var ice = now < state.immuneUntil;
      if (b.el.classList.contains('ice') !== ice) b.el.classList.toggle('ice', ice);

      if (b.long) {
        if (b.y > boardH) {
          Object.keys(state.holds).forEach(function (pid) {
            if (state.holds[pid] === b) delete state.holds[pid];
          });
          state.blocks.splice(i, 1);
          b.el.remove();
          continue;
        }
        continue;
      } else if (b.y > boardH + blockH * CFG.HOLD_GRACE) {
        if (now < state.sprintUntil) {
          // 冲刺期间：按键直接通过，不算失误
          state.blocks.splice(i, 1); b.el.remove(); continue;
        }
        loseLife('漏掉了一只奶蛙', b.el);
        if (!state.running) return;
        if (state.blocks.indexOf(b) >= 0) { state.blocks.splice(state.blocks.indexOf(b), 1); b.el.remove(); }
        continue;
      }
    }
    requestAnimationFrame(loop);
  }

  /* ====== 道具与转盘 ====== */
  var ITEM_DEF = {
    slow:   { name: '冰冰冰道具', img: ITEM_ICE_URL,    desc: '点右下角冰块，下落变慢 10 秒' },
    double: { name: '东北雨姐道具', img: ITEM_YUJIE_URL, desc: '15 秒内得分 ×2' },
    sprint: { name: '灭霸道具', img: ITEM_THANOS_URL,   desc: '开局冲刺 15 秒，二倍速且不掉血' }
  };
  var INV_KEY = 'naiwa_inv';
  function invState() { try { return JSON.parse(localStorage.getItem(INV_KEY) || '{}'); } catch (e) { return {}; } }
  function saveInv(o) { try { localStorage.setItem(INV_KEY, JSON.stringify(o)); } catch (e) {} }
  function invCount(k) { return invState()[k] | 0; }
  function invAdd(k, n) { var o = invState(); o[k] = Math.max(0, (o[k] | 0) + n); saveInv(o); refreshItemBadges(); }
  function refreshItemBadges() {
    var nodes = document.querySelectorAll('#itemBar .item');
    for (var i = 0; i < nodes.length; i++) {
      var k = nodes[i].dataset.item, b = nodes[i].querySelector('.item-badge'), c = invCount(k);
      if (b) { b.textContent = String(c); b.classList.toggle('hidden', c <= 0); }
      nodes[i].classList.toggle('empty', c <= 0);
    }
  }
  function selectItem(key) {
    if (state.item !== key && invCount(key) <= 0) { playBuf('fail', 0.6); return; }
    state.item = (state.item === key) ? null : key;
    var nodes = document.querySelectorAll('#itemBar .item');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.toggle('on', nodes[i].dataset.item === state.item);
    }
    if (state.item) playBuf('long', SND.long * 0.7);
  }

  var WHEEL_KEY = 'naiwa_wheel';
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function wheelState() {
    try {
      var o = JSON.parse(localStorage.getItem(WHEEL_KEY) || '{}');
      if (o.date !== todayStr()) o = { date: todayStr(), left: 3 };
      o.left = Math.max(0, Math.min(3, o.left | 0));
      return o;
    } catch (e) { return { date: todayStr(), left: 3 }; }
  }
  function saveWheel(o) { try { localStorage.setItem(WHEEL_KEY, JSON.stringify(o)); } catch (e) {} }
  function refreshWheelDot() {
    var o = wheelState(), dot = $('#wheelDot');
    if (!dot) return;
    dot.textContent = String(o.left);
    dot.classList.toggle('hidden', o.left <= 0);
  }
  var wheelRolling = false;
  function playWheel() {
    if (wheelRolling) return;
    var o = wheelState();
    var msg = $('#wheelMsg'), img = $('#wheelImg');
    if (o.left <= 0) { msg.textContent = '今天的 3 次已经抽完啦，明天再来'; return; }
    o.left -= 1; saveWheel(o); refreshWheelDot();
    wheelRolling = true;
    img.classList.remove('big');
    var keys = ['slow', 'double', 'sprint', 'none'];
    var n = 0;
    var timer = setInterval(function () {
      var k = keys[n % keys.length]; n++;
      img.src = (k === 'none') ? NAILONG_URL : ITEM_DEF[k].img;
      if (n > 55) {
        clearInterval(timer);
        var r = Math.random();
        var res = r < 0.25 ? 'slow' : r < 0.5 ? 'double' : r < 0.75 ? 'sprint' : 'none';
        wheelRolling = false;
        if (res === 'none') {
          img.src = NAILONG_URL; img.classList.add('big');
          msg.innerHTML = '乐子，你抽到了滚木';
          playBuf('laugh', SND.short);
        } else {
          img.src = ITEM_DEF[res].img;
          msg.innerHTML = '恭喜抽中「' + ITEM_DEF[res].name + '」<br>' + ITEM_DEF[res].desc;
          invAdd(res, 1);
          playBuf('over', 1);
        }
      }
    }, 90);
  }

  /* ====== 道具效果 ====== */
  var SLOW_MS = 10000, SPRINT_MS = 15000, DOUBLE_MS = 15000;
  function startItemEffects() {
    var now = performance.now();
    state.slowUsed = false;
    state.slowActive = false;
    state.slowUntil = 0;
    state.sprintUntil = 0;
    state.doubleUntil = 0;
    state.speedMul = 1;
    if (state.item === 'double') state.doubleUntil = now + DOUBLE_MS;
    if (state.item === 'sprint') {
      state.sprintUntil = now + SPRINT_MS;
      var lay = $('#sprintLayer');
      lay.classList.remove('hidden');
      lay.style.opacity = '1';
      setTimeout(function () { lay.style.opacity = '0'; }, SPRINT_MS - 1200);
      setTimeout(function () { lay.classList.add('hidden'); lay.style.opacity = '1'; }, SPRINT_MS + 400);
    }
    $('#btnSlow').classList.toggle('hidden', state.item !== 'slow');
  }
  function triggerSlow() {
    if (state.item !== 'slow' || state.slowUsed) return;
    state.slowUsed = true;
    state.slowActive = true;
    state.slowUntil = performance.now() + SLOW_MS;
    $('#btnSlow').classList.add('hidden');
  }
  function isSprint() { return state.running && performance.now() < state.sprintUntil; }
  function isDouble() { return performance.now() < state.doubleUntil; }

  /* ====== 暂停 ====== */
  function togglePause(on) {
    if (!state.running && on) return;
    state.paused = !!on;
    $('#pauseMask2').classList.toggle('hidden', !state.paused);
    if (!state.paused) state.last = performance.now();
  }

  function quitGame() {
    $('#quitMask').classList.add('hidden');
    state.paused = false;
    state.running = false;
    state.waitStart = false;
    stopBgm(bgmPlay);
    if (state.blocks) state.blocks.length = 0;
    $('#board').innerHTML = '';
    state.startEl = null;
    $('#itemBar').style.display = 'none';
    showScreen('home');
    if (SND.music) playBgm(bgmStart, 0.4);
    refreshWheelDot();
  }

  /* ====== 开局 ====== */
  function startGame() {
    stopBgm(bgmStart);
    stopBgm(sfxOver);
    stopBgm(sfxPause);
    showScreen('game');
    playBgm(bgmPlay, SND.music ? SND.bgm : 0);
    requestAnimationFrame(function () {
      measure();
      clearBlocks();
      state.score = 0;
      state.combo = 0;
      state.spawnAcc = 0;
      state.id = 0;
      state.lives = CFG.MAX_LIVES;
      state.holds = {};
      state.lastLongSide = -1;
      state.immuneUntil = 0;
      state.running = false;
      state.failLock = false;
      state.paused = false;
      state.waitStart = true;
      state.speedMul = 1;
      state.slowUntil = 0; state.slowActive = false; state.slowUsed = false;
      state.sprintUntil = 0; state.doubleUntil = 0;
      lastStarsShown = -1;
      $('#pauseMask2').classList.add('hidden');
      $('#sprintLayer').classList.add('hidden');
      $('#btnSlow').classList.add('hidden');
      refreshItemBadges();
      $('#itemBar').style.display = 'flex';
      renderLives();
      updateHud();
      if (state.startEl) { state.startEl.remove(); state.startEl = null; }
      var se = document.createElement('div');
      se.className = 'start-block';
      se.textContent = '开始';
      board.appendChild(se);
      state.startEl = se;
    });
  }

  function beginRound() {
    if (!state.waitStart) return;
    state.waitStart = false;
    $('#itemBar').style.display = 'none';
    if (state.item) invAdd(state.item, -1);
    if (state.startEl) { state.startEl.remove(); state.startEl = null; }
    startItemEffects();
    countdown(function () {
      state.last = performance.now();
      state.running = true;
      requestAnimationFrame(loop);
    });
  }

  /* ====== 输入 ====== */
  function pickBlockAt(px, py) {
    var best = null, bestD = 1e9;
    for (var i = 0; i < state.blocks.length; i++) {
      var b = state.blocks[i];
      var cx = b.col * colW + colW / 2;
      if (Math.abs(px - cx) > colW * CFG.TOL_X) continue;
      var top = b.y - blockH * CFG.TOL_Y;
      var bot = b.y + (b.long ? b.h : blockH) + blockH * CFG.TOL_Y;
      if (py < top || py > bot) continue;
      var d = Math.abs(py - (b.y + (b.long ? b.h : blockH) / 2));
      if (d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  function hitLongSegment(b, py) {
    var idx = Math.floor((py - b.y) / b.segH);
    idx = Math.max(0, Math.min(b.segs - 1, idx));
    if (b.hit[idx]) return;
    b.hit[idx] = true;
    if (b.el.children[idx]) b.el.children[idx].classList.add('hit');
    scoreBlock(b, 1, { keep: true, silent: true });
    if (!b.longSfxOnce) { b.longSfxOnce = true; playBuf('long', SND.long); }
  }

  board.addEventListener('pointerdown', function (e) {
    if (state.waitStart) { beginRound(); return; }
    if (!state.running) return;
    e.preventDefault();
    var rect = board.getBoundingClientRect();
    var px = e.clientX - rect.left, py = e.clientY - rect.top;
    var b = pickBlockAt(px, py);
    if (!b) { loseLife('点到了空白处', null); return; }
    if (b.long) {
      hitLongSegment(b, py);
    } else {
      scoreBlock(b, 1);
    }
  }, { passive: false });

  function releasePointer(id) {
    var b = state.holds[id];
    if (!b) return;
    delete state.holds[id];
    // 同一块可能被另一根手指按着
    var still = Object.keys(state.holds).some(function (pid) { return state.holds[pid] === b; });
    if (!still) { b.holding = false; b.el.classList.remove('hold'); }
  }

  window.addEventListener('pointerup', function (e) { releasePointer(e.pointerId); });
  window.addEventListener('pointercancel', function (e) { releasePointer(e.pointerId); });

  /* ====== 按钮 ====== */
  $('#btnSnd').addEventListener('click', function () { sndUi(); $('#sndPanel').classList.add('show'); });
  $('#sndClose').addEventListener('click', function () { $('#sndPanel').classList.remove('show'); });
  $('#sndPanel').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  ['bgm', 'long', 'short'].forEach(function (k) {
    var inp = $('#snd' + k.charAt(0).toUpperCase() + k.slice(1));
    if (inp) inp.addEventListener('input', function () { SND[k] = parseFloat(this.value); sndApply(); });
  });
  var sndM = $('#sndMusic');
  if (sndM) sndM.addEventListener('change', function () {
    SND.music = this.checked; sndApply();
    if (SND.music && homeEl.classList.contains('active') && bgmStart.paused) playBgm(bgmStart, 0.4);
  });
  $('#sndReset').addEventListener('click', function () { SND = { bgm: 0.5, long: 0.5, short: 0.5, music: true }; sndApply(); });
  sndUi();
  var itemNodes = document.querySelectorAll('#itemBar .item');
  for (var ii = 0; ii < itemNodes.length; ii++) {
    itemNodes[ii].addEventListener('click', function () { selectItem(this.dataset.item); });
  }
  $('#btnQuitGame').addEventListener('click', function () { $('#quitMask').classList.remove('hidden'); });
  $('#btnQuitNo').addEventListener('click', function () { $('#quitMask').classList.add('hidden'); });
  $('#btnQuitYes').addEventListener('click', quitGame);
  $('#btnPause').addEventListener('click', function () { togglePause(!state.paused); });
  $('#btnResume').addEventListener('click', function () { togglePause(false); });
  $('#btnQuit').addEventListener('click', function () { togglePause(false); state.running = false; stopBgm(bgmPlay); showScreen('home'); });
  $('#btnSlow').addEventListener('click', triggerSlow);
  $('#btnWheel').addEventListener('click', function () { refreshWheelDot(); $('#wheelPanel').classList.add('show'); });
  $('#wheelGo').addEventListener('click', playWheel);
  $('#wheelClose').addEventListener('click', function () { $('#wheelPanel').classList.remove('show'); });
  refreshWheelDot();
  $('#btnStart').addEventListener('click', startGame);
  $('#btnAgain').addEventListener('click', startGame);
  $('#btnHome').addEventListener('click', function () { showScreen('home'); });
  window.addEventListener('resize', function () { measure(); });

  /* ====== 初始化 ====== */
  // 浏览器自动播放策略：首次交互时解锁音频并补播首页 BGM（鸡你太美）
  var audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try { var a = ctx(); if (a.state === 'suspended') a.resume(); } catch (e) {}
    if (homeEl.classList.contains('active') && bgmStart.paused && SND.music) playBgm(bgmStart, 0.4);
  }
  window.addEventListener('pointerdown', unlockAudio, { capture: true });
  window.addEventListener('keydown', unlockAudio);
  window.addEventListener('touchstart', unlockAudio, { capture: true });

  $('#mascotImg').src = NAILONG_URL;
  pauseImg.src = PAUSE_IMG_URL;
  renderLives();
  renderHudStars(0, false);
  refreshItemBadges();
  showScreen('home');
})();
</script>
</body>
